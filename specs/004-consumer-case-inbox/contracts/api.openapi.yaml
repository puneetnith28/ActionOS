openapi: 3.1.0
info:
  title: ActionOS Consumer Case API
  version: 0.4.0
  description: Owner-authenticated projections and controls for the controlled consumer pilot.
servers:
  - url: /
security:
  - firebaseBearer: []
paths:
  /api/cases:
    get:
      summary: List bounded owner case summaries
      parameters:
        - { name: bucket, in: query, schema: { type: string, enum: [NEEDS_YOU, WORKING, DONE] } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
      responses:
        '200': { description: Owner-scoped page with items and optional nextCursor }
        '401': { description: Authentication required }
  /api/cases/{caseId}/detail:
    get:
      summary: Read channel-aware consumer case projection
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Case header, conversation, comparison, notification and controls }
        '403': { description: Owner mismatch without case disclosure }
        '404': { description: Case absent }
  /api/cases/{caseId}/identity:
    post:
      summary: Link or explicitly claim an unexecuted anonymous draft
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, idempotencyKey]
              properties:
                operation: { type: string, enum: [LINK_CURRENT, CLAIM_DRAFT] }
                idempotencyKey: { type: string, minLength: 16, maxLength: 200 }
                sourceIdToken: { type: string, description: One-time proof; never persisted }
      responses:
        '200': { description: Stable recoverable owner and case }
        '409': { description: Explicit collision or unsafe claim }
  /api/cases/{caseId}/notifications/retry:
    post:
      summary: Retry one eligible failed owner notification idempotently
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '202': { description: Retry accepted or duplicate }
        '409': { description: Suppressed, budget exhausted or not retryable }
  /api/cases/{caseId}/export:
    get:
      summary: Download a static redacted case summary
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Redacted text or PDF export }
        '403': { description: Owner mismatch }
  /api/cases/{caseId}/technical-run:
    get:
      summary: Read persisted redacted judge trace for an eligible synthetic case
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Ordered real persisted steps }
        '403': { description: Owner or eligibility denial }
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, pattern: '^case_[A-Za-z0-9_-]{8,128}$' }
