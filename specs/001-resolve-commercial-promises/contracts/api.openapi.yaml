openapi: 3.1.0
info:
  title: ActionOS MVP API
  version: 0.1.0
  description: >-
    Contract for intake, version-bound approval, durable execution, evidence callbacks,
    cancellation, reopening, and deletion. Controlled endpoints are never production merchants.
servers:
  - url: https://actionos.example.invalid
paths:
  /api/intakes:
    post:
      summary: Submit one promise artifact or bounded text input
      operationId: createIntake
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, minLength: 16, maxLength: 200 }
                instruction: { type: string, maxLength: 1000 }
                artifact: { type: string, format: binary }
      responses:
        "202":
          description: Accepted or deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeReceipt"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "413": { description: Artifact exceeds configured limits }
        "415": { description: Unsupported media type }
  /api/cases/{case_id}:
    get:
      summary: Read the user-safe current case and timeline
      operationId: getCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Current case view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseView" }
        "404": { description: Case not found or inaccessible }
  /api/cases/{case_id}/approve:
    post:
      summary: Approve exactly one Resolution Plan version and hash
      operationId: approvePlan
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_version, plan_hash, approval_token]
              properties:
                plan_version: { type: integer, minimum: 1 }
                plan_hash: { type: string }
                approval_token: { type: string }
      responses:
        "200":
          description: Plan approved and case ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseView" }
        "409": { description: Plan version/hash changed, token used, or transition illegal }
        "410": { description: Approval expired or revoked }
  /api/cases/{case_id}/cancel:
    post:
      summary: Stop future external actions
      operationId: cancelCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200": { description: Cancelled or already terminal }
        "409": { description: Cancellation cannot safely preempt an in-flight effect }
  /api/cases/{case_id}/reopen:
    post:
      summary: Report that a completed case is not resolved
      operationId: reopenCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Reopened into needs-attention state }
        "409": { description: State cannot be reopened }
  /api/cases/{case_id}/deletion:
    post:
      summary: Revoke authority and request case/artifact deletion
      operationId: requestDeletion
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "202": { description: Deletion and revocation accepted }
  /internal/tasks/execute:
    post:
      summary: Authenticated task delivery for one case command
      operationId: executeTask
      security: [{ taskOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_delivery_id, case_id, command, expected_case_version]
              properties:
                task_delivery_id: { type: string }
                case_id: { type: string }
                command:
                  {
                    type: string,
                    enum: [EVALUATE_DUE, DISPATCH_ACTION, RETRY_ACTION, PROCESS_EVIDENCE]
                  }
                expected_case_version: { type: integer, minimum: 0 }
      responses:
        "200": { description: Applied, deduplicated, or safely obsolete }
        "401": { description: Invalid service identity }
        "409": { description: Concurrent version; caller may retry }
  /api/counterparties/merchant/callback:
    post:
      summary: Receive a signed controlled-counterparty event
      operationId: merchantCallback
      parameters:
        - in: header
          name: X-ActionOS-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-ActionOS-Timestamp
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantCallback"
      responses:
        "202": { description: Accepted or deduplicated for processing }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { description: Invalid signature or stale timestamp }
components:
  securitySchemes:
    taskOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
  parameters:
    CaseId:
      in: path
      name: case_id
      required: true
      schema: { type: string }
  responses:
    InvalidRequest:
      description: Schema or policy validation failed
      content:
        application/json:
          schema:
            type: object
            required: [error, reason_code]
            properties:
              error: { type: string }
              reason_code: { type: string }
  schemas:
    IntakeReceipt:
      type: object
      required: [intake_id, status]
      properties:
        intake_id: { type: string }
        case_id: { type: [string, "null"] }
        status: { type: string, enum: [ACCEPTED, DEDUPLICATED] }
    CaseView:
      type: object
      required: [case_id, state, version, timeline, evidence_claim_limit]
      properties:
        case_id: { type: string }
        state:
          type: string
          enum:
            [
              DRAFT,
              AWAITING_APPROVAL,
              READY,
              RUNNING,
              WAITING_EXTERNAL,
              WAITING_RETRY,
              NEEDS_ATTENTION,
              DONE,
              FAILED,
              CANCELLED,
              EXPIRED
            ]
        version: { type: integer }
        plan: { type: [object, "null"], additionalProperties: true }
        timeline:
          type: array
          items: { type: object, additionalProperties: true }
        evidence_claim_limit:
          type: string
          enum:
            [
              PROMISE_RECORDED,
              REQUEST_ACKNOWLEDGED,
              MERCHANT_COMMITTED,
              MERCHANT_CONFIRMED,
              FUNDS_SETTLED
            ]
    MerchantCallback:
      type: object
      required: [event_id, request_id, case_id, status, occurred_at]
      properties:
        event_id: { type: string }
        request_id: { type: string }
        case_id: { type: string }
        status: { type: string, enum: [REQUEST_RECEIVED, REFUND_APPROVED, REFUND_DENIED] }
        amount_minor: { type: integer }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        transaction_ref: { type: string }
        occurred_at: { type: string, format: date-time }
