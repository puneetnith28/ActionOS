openapi: 3.1.0
info:
  title: ActionOS Multichannel Follow-Through API
  version: 0.1.0
paths:
  /api/channels:
    get:
      summary: List truthful channel capabilities and health
      responses:
        "200":
          description: Available, unavailable and future channel capabilities
  /api/cases/{caseId}/plan:
    get:
      summary: Inspect the owned conversation plan
      responses:
        "200": { description: Current plan and capabilities }
        "403": { description: Ownership required }
    post:
      summary: Revise, simulate, approve, reject or delete a plan
      responses:
        "200": { description: Updated plan or safe simulation }
        "409": { description: Stale, blocked or invalid plan command }
  /api/internal/tasks/run-case:
    post:
      summary: Execute one durable, authorized case step
      responses:
        "200": { description: Deterministic worker result }
        "401": { description: Cloud Tasks identity required }
        "503": { description: Approved channel unavailable }
  /api/webhooks/email:
    post:
      summary: Reserve a verified email-provider event for asynchronous processing
      responses:
        "202": { description: Verified event reserved or duplicate acknowledged }
        "400": { description: Invalid payload }
        "401": { description: Invalid or stale signature }
  /api/internal/tasks/process-inbound:
    post:
      summary: Retrieve, normalize, correlate and evaluate one reserved inbound event
      responses:
        "200": { description: Processed, rejected or intervention result }
        "401": { description: Cloud Tasks identity required }
        "409": { description: Event state conflict }
components:
  schemas:
    ChannelCapability:
      type: object
      required: [channelType, status, canSend, canReceive, supportsThreading,
        supportsDeliveryReceipt, supportsAuthenticatedReply, requiresUserOAuth, reasonCodes]
      properties:
        channelType: { enum: [CONTROLLED_SANDBOX, MANAGED_EMAIL, GMAIL_CONNECTED, PARTNER_API] }
        status: { enum: [AVAILABLE, DEGRADED, UNAVAILABLE, FUTURE] }
        canSend: { type: boolean }
        canReceive: { type: boolean }
        supportsThreading: { type: boolean }
        supportsDeliveryReceipt: { type: boolean }
        supportsAuthenticatedReply: { type: boolean }
        requiresUserOAuth: { type: boolean }
        reasonCodes: { type: array, items: { type: string } }
    ProviderWebhookAccepted:
      type: object
      required: [providerEventId, status, duplicate]
      properties:
        providerEventId: { type: string }
        status: { enum: [RESERVED, ENQUEUED, REJECTED] }
        duplicate: { type: boolean }
